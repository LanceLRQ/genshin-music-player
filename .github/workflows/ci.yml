name: CI

# 触发策略：tag 为准——push v* tag 时前端检查 + 构建 Windows 安装包与便携版并发布 Release。
# 分支 push 不自动触发（现阶段在本机验收），需要时在 Actions 页面手动运行，
# 勾选 build-windows 可以不打 tag 先验证 Windows 构建。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build-windows:
        description: 同时构建 Windows 安装包与便携版（发布前验证用）
        type: boolean
        default: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  # 只在 tag（或手动勾选）时构建；产物：NSIS 安装包 + 便携版 zip
  build-windows:
    needs: frontend
    if: github.event_name == 'push' || inputs.build-windows == true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: 确定版本号（tag 去 v 前缀；手动运行沿用 tauri.conf 版本）
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 把 tag 版本号写进 tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')" ${{ steps.version.outputs.version }}

      # 安装包只出 NSIS（不打包 MSI）；便携版直接取构建出的裸 exe
      - run: pnpm tauri build --bundles nsis

      - name: 打包便携版
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item 'src-tauri/target/release/genshin-music-player.exe' 'portable/Genshin Music Player.exe'
          @'
          Genshin Music Player 便携版

          解压到任意目录，直接运行「Genshin Music Player.exe」。

          - 需要 Windows 10 及以上，以及 WebView2 运行时（Windows 11 和较新的 Windows 10 已内置；
            缺失时从微软官网安装：https://developer.microsoft.com/microsoft-edge/webview2/）
          - 便携版不写注册表、不需要安装；设置与自定义乐器保存在系统的应用数据目录：
            %APPDATA%\io.github.lancelrq.genshin-music-player
          - 想彻底删除：删掉解压目录和上面的应用数据目录即可
          - 使用方法见软件内的「帮助」页面
          '@ | Set-Content 'portable/使用说明.txt' -Encoding utf8
          Compress-Archive -Path 'portable/*' -DestinationPath "portable/Genshin-Music-Player_${version}_x64-portable.zip"

      # 先传构建产物，Release 发布失败时也能从 Actions 页面取回
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.zip
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 版本号带预发布后缀（如 v0.1.0-rc1）自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
