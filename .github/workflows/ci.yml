name: CI

# 暂停自动触发：当前阶段在本机跑 pnpm lint / typecheck / test 验收，
# 需要时在 Actions 页面手动运行。恢复自动跑就把下面的 push / pull_request 解注释。
on:
  workflow_dispatch:
  # push:
  #   branches: [main, dev]
  # pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
